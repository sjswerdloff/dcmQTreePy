# Gitea CI (#19), on our self-hosted Mac Studio runner. .github/workflows/ stays for GitHub's hosted
# runners; Gitea reads .gitea/workflows/ in preference to it, so GitHub's workflows (which use sudo,
# Windows runners and GitHub secrets) never run here. Keep the gates in step with
# .github/workflows/python-app.yml: a gate added to one belongs in the other.
#
# Host mode: the steps run directly on the runner machine, as its own `gitearunner` account, with no
# sudo. Nothing is installed into any Python the host uses: uv provides the interpreter that
# requires-python asks for and the project's own .venv in the checkout.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
# github-main carries code from GitHub: on its PRs every job here waits for a person to add the github-reviewed
# label (Stuart, 27 Oct, mirror-tools #15). The return path removes that label before it pushes new GitHub code.
jobs:
  gates:
    if: (github.head_ref != 'github-main' || contains(github.event.pull_request.labels.*.name, 'github-reviewed'))
    # Pinned to the Mac Studio. `macos-latest` is also declared by the M1 Max, whose runner is the
    # account every Kindled session there shares, and the same commit has passed or failed there by
    # which machine took the job (kindled-skills test.yml). stuart-m3ultra-canary is the Mac Studio alone.
    runs-on: stuart-m3ultra-canary
    env:
      # The runner has no window-server session; PySide6 uses Qt's offscreen platform.
      QT_QPA_PLATFORM: offscreen
      # The Studio tests the floor, always (#4). requires-python allows 3.12-3.14 and the runner keeps uv-managed
      # Pythons between jobs, so an unpinned choice could change between runs with no commit changing it.
      UV_PYTHON: "3.12"
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv is pinned (#21): its lockfile handling moves with its version, so a floating uv could fail every
      # --locked gate with no cause in any PR. 0.9.9 is the uv the first Studio run (#12230) passed with.
      - name: uv, pinned
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.9"
      - name: Which uv and host
        run: |
          echo "uv: $(command -v uv) -> $(uv --version)"
          echo "runner host: $(hostname)"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint with ruff
        run: uv run --locked ruff check .
      - name: Check formatting with ruff
        run: uv run --locked ruff format --check .
      # The floor, 3.12, here (UV_PYTHON above; printed below); the 3.12-3.14 matrix runs on GitHub (#4).
      - name: Test with pytest
        run: |
          uv run --locked python --version
          uv run --locked pytest dcmqtreepy/tests
