[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Single-source pins (uv migration parity, issue #1): every resolved version in
# this table matches poetry.lock at main b8481c6 exactly. uv's free resolution
# drifts (see PR body table); this file re-straightens it. Bumps belong in #4,
# deliberately, one cause at a time. Medical repo: lockfile churn = behaviour churn.
# #3 moved the dev tooling (pytest, pre-commit, pyinstaller and what they pull) to
# current releases that still support Python 3.10, and dropped tomli (never imported).
# pydicom stays 2.4.4: dcm-mini-viewer pins it exactly (pydicom==2.4.4).
dependencies = [
    "PySide6>=6.7.2,<7",
    "pydicom>=2.4.4,<3",
    "pynetdicom>=2.1.0,<3",
    "streamlit>=1.42.2,<2",
    "dcm-mini-viewer",
    # platformdirs is imported by dcmqtreepy/dcmQTree.py:9 (user_log_dir) — a
    # RUNTIME import, not tooling. Declared here so `uv sync --no-dev` installs
    # it; the constraint below pins it to poetry.lock parity 4.3.8 (Refs #11).
    "platformdirs>=4.2.0,<5",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2,<5",
    "pyinstaller>=6.22.3,<7",
    "ruff>=0.15",
]

# Tooling-only parity with poetry.lock @ main b8481c6 (Refs #1, cora + connor).
# [project].dependencies keeps Poetry's caret meaning (the declaration says what
# the package PROMISES); these constraints, not the declaration, hold the exact
# versions in uv.lock. uv re-resolves freely, so without constraints 40 of the 66
# common packages drift incl runtime majors (python-dateutil 3.0, narwhals 2,
# filelock 4, virtualenv 21, rpds-py, pyinstaller 6.22) AND the directs uv would
# float above the caret floor (PySide6, pydicom, pynetdicom, streamlit, numpy,
# pillow). Constraints are the ONLY place exact versions live; #4 bumps with
# `uv lock --upgrade-package X`, no declaration churn. Intentional set-difference
# (NOT constrained): flake8/mccabe/pycodestyle/pyflakes/black/isort/
# mypy-extensions/pathspec leave (migrated to ruff). Majors that must move
# (py3.13, PySide6, numpy) go in #4 deliberately.
[tool.uv]
constraint-dependencies = [
    "altgraph==0.17.4",
    "attrs==25.3.0",
    "certifi==2025.4.26",
    "cfgv==3.4.0",
    "charset-normalizer==3.4.2",
    "click==8.2.0",
    "distlib==0.3.9",
    "exceptiongroup==1.3.0",
    "filelock==4.1.0",
    "gitpython==3.1.44",
    "identify==2.6.10",
    "idna==3.10",
    "iniconfig==2.1.0",
    "jsonschema-specifications==2025.4.1",
    "jsonschema==4.23.0",
    "macholib==1.16.3",
    "markupsafe==3.0.2",
    "narwhals==1.40.0",
    "nodeenv==1.9.1",
    "numpy==2.2.6",
    "packaging==24.2",
    "pandas==2.2.3",
    "pefile==2023.2.7",
    "pillow==11.2.1",
    "platformdirs==4.3.8",
    "pluggy==1.6.0",
    "pre-commit==4.6.2",
    "protobuf==6.31.0",
    "pyarrow==20.0.0",
    "pydeck==0.9.1",
    "pydicom==2.4.4",
    "pygments==2.21.0",
    "pyinstaller-hooks-contrib==2026.9",
    "pyinstaller==6.22.3",
    "pynetdicom==2.1.1",
    "PySide6==6.8.3",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-discovery==1.6.4",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "referencing==0.36.2",
    "requests==2.32.4",
    "rpds-py==0.25.0",
    "setuptools==84.2.1",
    "smmap==5.0.2",
    "streamlit==1.45.1",
    "tenacity==9.1.2",
    "tomli==2.2.1",
    "tornado==6.5",
    "typing-extensions==4.13.2",
    "tzdata==2025.2",
    "urllib3==2.4.0",
    "virtualenv==21.14.5",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
