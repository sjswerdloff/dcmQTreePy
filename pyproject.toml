[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Single-source pins (uv migration parity, issue #1): every resolved version in
# this table matches poetry.lock at main b8481c6 exactly. uv's free resolution
# drifts (see PR body table); this file re-straightens it. Bumps belong in #4,
# deliberately, one cause at a time. Medical repo: lockfile churn = behaviour churn.
dependencies = [
    "PySide6==6.8.3",
    "pydicom==2.4.4",
    "pynetdicom==2.1.1",
    "tomli==2.2.1",
    "streamlit==1.45.1",
    "dcm-mini-viewer",
    # transitive numeric pins — match poetry.lock resolved at main b8481c6
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==20.0.0",
    "protobuf==6.31.0",
    "pillow==11.2.1",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "pre-commit>=3.7.1,<4",
    "pyinstaller>=6.13,<7",
    "ruff>=0.15",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
