[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact versions live in [tool.uv] constraint-dependencies below, not here: the
# declarations keep their caret meaning. Medical repo: lockfile churn = behaviour
# churn, so every version move is deliberate and named in its PR.
# #3 (Stuart, 27 Oct: Python 3.12 is the floor): streamlit and what only it pulls in
# are unpinned and float to latest; the dev tooling moved to latest and is pinned;
# tomli (never imported) is dropped. The <3.13 cap and pydicom 2.4.4 stay with
# dcm-mini-viewer, which caps Python <3.13 and requires pydicom==2.4.4 exactly.
dependencies = [
    "PySide6>=6.7.2,<7",
    "pydicom>=2.4.4,<3",
    "pynetdicom>=2.1.0,<3",
    "streamlit>=1.42.2,<2",
    "dcm-mini-viewer",
    # platformdirs is imported by dcmqtreepy/dcmQTree.py:9 (user_log_dir) — a
    # RUNTIME import, not tooling. Declared here so `uv sync --no-dev` installs
    # it; the constraint below pins its exact version (Refs #11).
    "platformdirs>=4.2.0,<5",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2,<5",
    "pyinstaller>=6.22.3,<7",
    "ruff>=0.15",
]

# Pins for everything except streamlit's own tree (#3: Stuart wants streamlit kept
# current, so it and what only it pulls in are deliberately NOT constrained here).
# [project].dependencies keeps Poetry's caret meaning (the declaration says what
# the package PROMISES); these constraints hold the exact versions in uv.lock, so
# uv's free re-resolution cannot move them. Bump with `uv lock --upgrade-package X`
# after changing the pin here. Not constrained either: ruff (a floor in the dev
# group) and PySide6's own sub-packages, which follow PySide6. Majors held by
# dcm-mini-viewer's caps (py3.13, PySide6, numpy, pydicom) move in #4.
[tool.uv]
constraint-dependencies = [
    "altgraph==0.17.5",
    "cfgv==3.5.0",
    "distlib==0.4.4",
    "filelock==4.2.4",
    "identify==2.6.20",
    "iniconfig==2.3.1",
    "macholib==1.16.4",
    "nodeenv==1.11.0",
    "numpy==2.2.6",
    "packaging==26.3",
    "pefile==2024.8.26",
    "platformdirs==4.13.5",
    "pluggy==1.7.0",
    "pre-commit==4.7.0",
    "pydicom==2.4.4",
    "pygments==2.21.0",
    "pyinstaller-hooks-contrib==2026.9",
    "pyinstaller==6.22.3",
    "pynetdicom==2.1.1",
    "PySide6==6.8.3",
    "pytest==9.1.1",
    "python-discovery==1.6.4",
    "pyyaml==6.0.3",
    "setuptools==84.2.1",
    "typing-extensions==4.13.2",
    "virtualenv==21.14.13",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py312"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
