[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Single-source pins (uv migration parity, issue #1): every resolved version in
# this table matches poetry.lock at main b8481c6 exactly. uv's free resolution
# drifts (see PR body table); this file re-straightens it. Bumps belong in #4,
# deliberately, one cause at a time. Medical repo: lockfile churn = behaviour churn.
dependencies = [
    "PySide6==6.8.3",
    "pydicom==2.4.4",
    "pynetdicom==2.1.1",
    "tomli==2.2.1",
    "streamlit==1.45.1",
    "dcm-mini-viewer",
    # transitive numeric pins — match poetry.lock resolved at main b8481c6
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==20.0.0",
    "protobuf==6.31.0",
    "pillow==11.2.1",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "pre-commit>=3.7.1,<4",
    "pyinstaller>=6.13,<7",
    "ruff>=0.15",
]

# Tooling-only parity with poetry.lock @ main b8481c6 (Refs #1, cora review).
# uv re-resolves transitives freely, so even with every direct dep pinned
# `==`, 40 of the 66 common packages drift (incl. runtime majors:
# python-dateutil 3.0, narwhals 2, filelock 4, virtualenv 21, rpds-py,
# pyinstaller 6.22). On a medical repo those are unverified behaviour changes.
# These constraints freeze each common transitive to its poetry.lock version;
# anything uv would raise stays at parity. Intentional set-difference (NOT
# constrained): flake8/mccabe/pycodestyle/pyflakes/black/isort/
# mypy-extensions/pathspec leave (migrated to ruff); python-discovery is uv's
# own setup helper. Majors that must move (py3.13, PySide6, numpy) go in #4.
[tool.uv]
constraint-dependencies = [
    "altgraph==0.17.4",
    "attrs==25.3.0",
    "certifi==2025.4.26",
    "cfgv==3.4.0",
    "charset-normalizer==3.4.2",
    "click==8.2.0",
    "distlib==0.3.9",
    "exceptiongroup==1.3.0",
    "filelock==3.18.0",
    "gitpython==3.1.44",
    "identify==2.6.10",
    "idna==3.10",
    "iniconfig==2.1.0",
    "jsonschema==4.23.0",
    "jsonschema-specifications==2025.4.1",
    "macholib==1.16.3",
    "markupsafe==3.0.2",
    "narwhals==1.40.0",
    "nodeenv==1.9.1",
    "packaging==24.2",
    "pefile==2023.2.7",
    "platformdirs==4.3.8",
    "pluggy==1.6.0",
    "protobuf==6.31.0",
    "pyarrow==20.0.0",
    "pydeck==0.9.1",
    "pyinstaller==6.13.0",
    "pyinstaller-hooks-contrib==2025.4",
    "pytest==8.3.5",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "referencing==0.36.2",
    "requests==2.32.4",
    "rpds-py==0.25.0",
    "setuptools==80.7.1",
    "smmap==5.0.2",
    "tenacity==9.1.2",
    "tornado==6.5",
    "typing-extensions==4.13.2",
    "tzdata==2025.2",
    "urllib3==2.4.0",
    "virtualenv==20.31.2",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
