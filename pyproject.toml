[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.7.2,<7",
    "pydicom>=2.4.4,<3",
    "pynetdicom>=2.1.0,<3",
    "tomli>=2.0.1,<3",
    "streamlit>=1.42.2,<2",
    "dcm-mini-viewer",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "pre-commit>=3.7.1,<4",
    "pyinstaller>=6.13,<7",
    "ruff>=0.15",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
