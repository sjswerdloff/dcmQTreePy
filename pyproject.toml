[project]
name = "dcmqtreepy"
version = "0.3.1"
description = "A PySide6 and pydicom based DICOM object editor"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.15"
# Exact versions live in uv.lock, not here: the declarations keep their caret meaning.
# Medical repo: lockfile churn = behaviour churn, so versions move only in a reviewed PR,
# monthly through Dependabot (Stuart, 8 Nov 2026) or by a named `uv lock --upgrade-package X`.
# The [tool.uv] constraint-dependencies that duplicated uv.lock were dropped (Stuart, 13 Nov
# 2026, #91): Dependabot could not move them, so its monthly PR would leave those pins behind.
# #3 (Stuart, 27 Oct: Python 3.12 is the floor): streamlit and what only it pulls in
# are unpinned and float to latest; the dev tooling moved to latest and is pinned;
# tomli (never imported) is dropped. #4 (dcm-mini-viewer now Python 3.12-3.14, PySide6 >=6.9,
# pydicom >=2.4.5,<3) lifts the cap to <3.15 and moves PySide6, numpy and pydicom with it.
dependencies = [
    "PySide6>=6.7.2,<7",
    "pydicom>=2.4.5,<3",
    "pynetdicom>=2.1.0,<3",
    "streamlit>=1.42.2,<2",
    "dcm-mini-viewer",
    # platformdirs is imported by dcmqtreepy/dcmQTree.py:9 (user_log_dir) — a
    # RUNTIME import, not tooling. Declared here so `uv sync --no-dev` installs
    # it; the constraint below pins its exact version (Refs #11).
    "platformdirs>=4.2.0,<5",
    # JPEG 2000 decoding (#39): pydicom 2.4.5 falls back to pylibjpeg-openjpeg (MIT) when
    # Pillow's handler fails on signed images. Never pylibjpeg[all] or pylibjpeg-libjpeg:
    # that plugin is GPL-3.0 and this app is Apache-2.0.
    "pylibjpeg>=2.1.0,<3",
    # No Windows ARM64 wheel exists (2.6.0), and a source build needs CMake and a C
    # toolchain, so it is left out there and J2K does not render on that platform.
    "pylibjpeg-openjpeg>=2.6.0,<3; sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[project.scripts]
dcmQTreePy = "dcmqtreepy.dcmQTree:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2,<5",
    "pyinstaller>=6.22.3,<7",
    "ruff>=0.15",
]

[tool.uv.sources]
dcm-mini-viewer = { git = "https://github.com/sjswerdloff/dcm-mini-viewer.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcmqtreepy"]

[tool.ruff]
line-length = 127
target-version = "py312"
extend-exclude = ["dcmqtreepy/mainwindow.py", "dcmqtreepy/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings left for a follow-up (not tooling changes):
# F401 unused import in load-privates try block; B025 duplicate `except Exception`.
"streamlit_dicom_viewer.py" = ["F401", "B025"]
