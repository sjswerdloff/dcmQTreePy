# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      # Every supported Python keeps its own result: one leg failing must not cancel the others (#4).
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install system libraries
      # PySide6 needs libEGL.so.1, which the Ubuntu 26.04 image no longer ships (#45).
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1

    - name: Install dependencies
      run: |
        uv sync --locked --dev

    - name: Lint with ruff
      run: |
        uv run ruff check .
    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .
    - name: Test with pytest
      run: |
        uv run python --version
        uv run pytest dcmqtreepy/tests
