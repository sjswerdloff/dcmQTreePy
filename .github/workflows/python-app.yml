# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: "3.10"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked --dev

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 dcmqtreepy --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        # --extend-ignore=203 because black puts in a space before a slicing
        uv run flake8 --count --extend-ignore=E203,E266,F401 --max-line-length=127 --statistics --exclude="dcmqtreepy/mainwindow.py" dcmqtreepy
    - name: Test with pytest
      run: |
        uv run pytest dcmqtreepy/tests
